excluded:
  - .build
  - build

# Coordinate/geometry code legitimately uses x, y, w, h, p.
identifier_name:
  min_length: 1

# State-machine dispatch and canvas drawing are naturally wide.
cyclomatic_complexity:
  warning: 20
  error: 30
type_body_length:
  warning: 700
  error: 1000
file_length:
  warning: 900
  error: 1200
function_body_length:
  warning: 80
  error: 120
line_length:
  warning: 140
  error: 200
# RGBA samples and capture-call logs are 3–4 field records.
large_tuple:
  warning: 4
  error: 6
